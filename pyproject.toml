[project]
name = "time-series-library"
version = "0.1.0"
description = "The Time Series Library project is being refactored using uv, restructured as a lib package, and equipped with Pydantic-based configuration validation."
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "chronos-forecasting>=2.2.1,<3.0.0",
    "datasets>=4.5.0,<5.0.0",
    "einops>=0.8.1,<1.0.0",
    "huggingface-hub>=0.36.0,<1.0.0",
    "local-attention>=1.11.2,<2.0.0",
    "loguru>=0.7.3",
    "matplotlib>=3.10.8,<4.0.0",
    "numpy>=2.1.2,<3.0.0",
    "pandas>=2.3.3,<3.0.0",
    "patool>=4.0.3,<5.0.0",
    "pywavelets>=1.9.0,<2.0.0",
    "reformer-pytorch>=1.4.4,<2.0.0",
    "scikit-learn>=1.7.2,<2.0.0",
    "scipy>=1.16.3,<2.0.0",
    "sktime>=0.40.1,<1.0.0",
    "sympy>=1.13.1,<2.0.0",
    "timesfm>=1.3.0,<2.0.0",
    "tirex-ts>=1.3.0,<2.0.0",
    "tqdm>=4.66.5,<5.0.0",
    "transformers>=4.57.3,<5.0.0",
]

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[project.scripts]
tslib-run = "tslib.run:main"

[tool.uv.build-backend]
module-name = "tslib"

[dependency-groups]
dev = [
    "pytest<8.0.0,>=7.4.3",
    "mypy<2.0.0,>=1.8.0",
    "ty>=0.0.25",
    "ruff<1.0.0,>=0.2.2",
    "prek>=0.2.24,<1.0.0",
    "coverage<8.0.0,>=7.4.3",
]

uni2ts = [
    "gluonts>=0.16.2,<1.0.0",
    "hydra-core>=1.3.0,<2.0.0",
    "jax>=0.8.1,<1.0.0",
    "jaxtyping>=0.3.4,<1.0.0",
    "lightning>=2.6.0,<3.0.0",
    "orjson>=3.11.5,<4.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "tensorboard>=2.20.0,<3.0.0",
]

[project.optional-dependencies]
cpu = ["torch>=2.5.1,<3.0.0", "torchvision>=0.20.1,<1.0.0", "torchaudio>=2.5.1,<3.0.0"]
cu118 = ["torch>=2.5.1,<3.0.0", "torchvision>=0.20.1,<1.0.0", "torchaudio>=2.5.1,<3.0.0"]
cu121 = ["torch>=2.5.1,<3.0.0", "torchvision>=0.20.1,<1.0.0", "torchaudio>=2.5.1,<3.0.0"]
cu124 = ["torch>=2.5.1,<3.0.0", "torchvision>=0.20.1,<1.0.0", "torchaudio>=2.5.1,<3.0.0"]

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cu118" },
        { extra = "cu121" },
        { extra = "cu124" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu118", extra = "cu118" },
    { index = "pytorch-cu121", extra = "cu121" },
    { index = "pytorch-cu124", extra = "cu124" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu118", extra = "cu118" },
    { index = "pytorch-cu121", extra = "cu121" },
    { index = "pytorch-cu124", extra = "cu124" },
]
torchaudio = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu118", extra = "cu118" },
    { index = "pytorch-cu121", extra = "cu121" },
    { index = "pytorch-cu124", extra = "cu124" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.mypy]
strict = true
exclude = ["venv", ".venv"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG001", # unused arguments in functions
    "T201",   # print statements are not allowed
]
ignore = [
    "E501", # line too long, handled by black
    "B008", # do not perform function calls in argument defaults
    "W191", # indentation contains tabs
    "B904", # Allow raising exceptions without from e, for HTTPException
]

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true

[tool.coverage.run]
source = ["src"]
dynamic_context = "test_function"

[tool.coverage.report]
show_missing = true
sort = "-Cover"

[tool.coverage.html]
show_contexts = true

[tool.ty.terminal]
error-on-warning = true
